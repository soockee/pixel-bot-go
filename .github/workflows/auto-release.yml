name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create instead of the next patch (for example v1.1.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: Determine next tag
        id: next_tag
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          git fetch --tags
          requested="$REQUESTED"
          if [ -n "$requested" ]; then
            if ! echo "$requested" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version must look like v1.2.3, got: $requested" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then
              echo "tag $requested already exists" >&2
              exit 1
            fi
            echo "last_tag=" >> $GITHUB_OUTPUT
            echo "next_tag=$requested" >> $GITHUB_OUTPUT
            exit 0
          fi
          last_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$last_tag" ]; then
            next="v1.0.0"
          else
            ver=${last_tag#v}
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch+1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "last_tag=$last_tag" >> $GITHUB_OUTPUT
          echo "next_tag=$next" >> $GITHUB_OUTPUT

      - name: Skip release if flagged
        if: contains(github.event.head_commit.message, 'skip-release')
        run: |
          echo 'skip-release found in commit message; exiting early.'
          exit 0

      - name: Create tag
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        run: |
          git tag ${{ steps.next_tag.outputs.next_tag }}
          git push origin ${{ steps.next_tag.outputs.next_tag }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build frontend
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows binary
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        run: |
          mkdir -p dist
          # The version lets the app offer newer releases (internal/update).
          GOOS=windows GOARCH=amd64 go build -tags production \
            -ldflags "-X github.com/soocke/pixel-bot-go/internal/update.Version=${{ steps.next_tag.outputs.next_tag }}" \
            -o dist/pixel-bot-go-windows-amd64.exe .

      - name: Generate checksum
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        run: |
          cd dist
          sha256sum * > CHECKSUMS.txt

      - name: Create GitHub Release
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.next_tag.outputs.next_tag }}
          name: Visual Response Lab ${{ steps.next_tag.outputs.next_tag }}
          generate_release_notes: true
          files: |
            dist/pixel-bot-go-windows-amd64.exe
            dist/CHECKSUMS.txt

      - name: Upload build artifact (for inspection)
        if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixel-bot-go-${{ steps.next_tag.outputs.next_tag }}
          path: dist/
