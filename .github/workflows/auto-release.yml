name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create instead of the next patch (for example v1.1.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  test:
    # Forks never run this repository's workflows.
    if: github.repository == 'soockee/pixel-bot-go'
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    # A commit message with skip-release ships nothing.
    if: ${{ !contains(github.event.head_commit.message, 'skip-release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: Determine next tag
        id: next_tag
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          requested="$REQUESTED"
          if [ -n "$requested" ]; then
            if ! echo "$requested" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version must look like v1.2.3, got: $requested" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then
              echo "tag $requested already exists" >&2
              exit 1
            fi
            echo "next_tag=$requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$last_tag" ]; then
            next="v1.0.0"
          else
            ver=${last_tag#v}
            IFS='.' read -r major minor patch <<< "$ver"
            next="v${major}.${minor}.$((patch+1))"
          fi
          echo "next_tag=$next" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # nothing cached flows into a published build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows binary
        env:
          VERSION: ${{ steps.next_tag.outputs.next_tag }}
        run: |
          mkdir -p dist
          # The version lets the app offer newer releases (internal/update).
          # -H=windowsgui builds a GUI program, so starting the app opens no terminal.
          pkg=github.com/soocke/pixel-bot-go/internal
          GOOS=windows GOARCH=amd64 go build -tags production \
            -ldflags "-H=windowsgui -X $pkg/update.Version=$VERSION" \
            -o dist/pixel-bot-go-windows-amd64.exe .

      - name: Generate checksum
        working-directory: dist
        run: sha256sum * > CHECKSUMS.txt

      # gh creates the tag on this commit along with the release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next_tag.outputs.next_tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Go Fish $TAG" --generate-notes \
            dist/pixel-bot-go-windows-amd64.exe dist/CHECKSUMS.txt

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixel-bot-go-${{ steps.next_tag.outputs.next_tag }}
          path: dist/
