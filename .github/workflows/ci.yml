name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Forks never run this repository's workflows.
    if: github.repository == 'soockee/pixel-bot-go'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # shortcut: the race detector has never run on this code, remove continue-on-error after a clean run here.
      - name: Test with race detector
        continue-on-error: true
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
