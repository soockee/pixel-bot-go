# GitHub Pages builds this folder with Jekyll: https://soockee.github.io/pixel-bot-go/
title: Go Fish
description: Docs for Go Fish, a Windows app that finds your bobber, watches for the bite and reels in.
baseurl: /pixel-bot-go
repository: soockee/pixel-bot-go
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
exclude:
  - dev
  - ARCHITECTURE_REVIEW.md
defaults:
  - scope: { path: "" }
    values: { layout: doc }

# The four Diataxis quadrants (tutorials, how-to, reference, explanation), in reading order.
sections:
  - id: tutorials
    title: Get started
  - id: how-to
    title: How-to guides
  - id: reference
    title: Reference
  - id: explanation
    title: Understand
